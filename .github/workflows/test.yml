name: Tests

on: [push, pull_request]          # corre en cada push y en cada PR

jobs:
  pytest:
    runs-on: ubuntu-latest        # una máquina Linux limpia en la nube de GitHub
    steps:
      - uses: actions/checkout@v4          # baja tu código al runner
      - uses: actions/setup-python@v5      # instala Python
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Correr tests
        run: pytest -v