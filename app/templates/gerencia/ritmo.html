{% extends "base_gerencia.html" %}
{% set metrica_activa = "ritmo" %}

{% block titulo %}Ritmo de ventas{% endblock %}

{% block contenido %}
        <div class="vista-cabecera">
            <div class="vista-titulo">Ritmo de ventas</div>
            <div class="vista-sub">Motos vendidas semana a semana</div>
        </div>

        {% if ventas_semana %}
        <canvas id="grafico-ritmo"></canvas>

        <script>
            const datos = {{ ventas_semana | tojson }};
            const ordenadas = datos.slice().reverse();
            const etiquetas = ordenadas.map(v => v.semana);
            const valores = ordenadas.map(v => v.ventas);
            const lienzo = document.getElementById("grafico-ritmo");
            new Chart(lienzo, {
                type: "line",
                data: {
                    labels: etiquetas,
                    datasets: [{ label: "Ventas por semana", data: valores, borderColor: "#e56a00", tension: 0.3 }]
                }
            });
        </script>
        {% else %}
        <div class="vacio">Aún no hay ventas registradas.</div>
        {% endif %}
{% endblock %}
