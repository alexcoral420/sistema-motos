{% extends "_base_motero.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block nav_mi_espacio %}active{% endblock %}

{% block contenido %}
    <h1>Ingresa a tu <em>espacio</em></h1>
    <p class="intro">Tus motos, en un solo lugar.</p>

    <div class="tarjeta">
        {% if error %}<div class="mensaje error" role="alert">{{ error }}</div>{% endif %}

        <form method="post" action="{{ url_for('motero.ingresar') }}" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="next" value="{{ siguiente }}">

            <div class="campo">
                <label for="email">Correo</label>
                <input type="email" id="email" name="email" autocomplete="email"
                       maxlength="254" required value="{{ email }}">
            </div>
            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password"
                       autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn-cta">Ingresar</button>
        </form>
    </div>

    <p class="nota">¿No tienes cuenta? <a href="{{ url_for('motero.registro') }}">Crea una gratis</a>.</p>
{% endblock %}
