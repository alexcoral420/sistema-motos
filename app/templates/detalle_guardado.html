<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle guardado · Universal Motors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --naranja: #ff7a00;
            --naranja-claro: #ff9633;
            --negro-900: #050505;
            --negro-800: #0d0d0d;
            --negro-700: #141414;
            --borde: #2a2a2a;
            --blanco: #f5f5f5;
            --texto: #e8e8e8;
            --texto-suave: #a8a8a8;
            --texto-tenue: #777;
            --naranja-aviso: #ff7a00;
            --verde: #34c759;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Barlow', 'Segoe UI', Arial, sans-serif; background: var(--negro-800); color: var(--texto); }
        h1 { font-family: 'Barlow Condensed', 'Segoe UI', sans-serif; text-transform: uppercase; }

        .barra { background: var(--negro-900); border-bottom: 2px solid var(--naranja); padding: 16px 24px; }
        .barra h1 { color: var(--blanco); font-size: 24px; }
        .barra h1 span { color: var(--naranja); }

        .contenedor { max-width: 560px; margin: 60px auto 0; padding: 0 24px; text-align: center; }
        .check { font-size: 56px; color: var(--verde); margin-bottom: 12px; }
        .titulo { font-size: 24px; color: var(--blanco); font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; margin-bottom: 8px; }
        .sub { color: var(--texto-suave); font-size: 15px; margin-bottom: 28px; }

        .aviso-desc { background: rgba(255,122,0,0.1); border: 1px solid var(--naranja); color: var(--naranja-claro); padding: 14px 18px; border-radius: 10px; font-size: 14px; margin-bottom: 28px; text-align: left; }
        .aviso-desc strong { display: block; margin-bottom: 4px; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }

        .btn { display: inline-block; text-decoration: none; background: var(--naranja); color: var(--negro-900); border-radius: 8px; padding: 12px 24px; font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 700; }
        .btn:hover { background: var(--naranja-claro); }
    </style>
</head>
<body>
    <div class="barra">
        <h1>Universal <span>Motors</span></h1>
    </div>

    <div class="contenedor">
        <div class="check">✓</div>
        <div class="titulo">Detalle guardado</div>
        <p class="sub">El comprador, los pagos y el precio quedaron registrados para esta venta.</p>

        {% if aviso %}
        <div class="aviso-desc">
            <strong>Aviso: los pagos no cuadran con el precio</strong>
            {{ aviso }}
        </div>
        {% endif %}

        <a href="{{ url_for('admin.vista_ventas_pendientes') }}" class="btn">Volver a pendientes</a>
    </div>
</body>
</html>
