<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle guardado · Universal Motors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <style>

        .contenedor { max-width: 560px; margin: 60px auto 0; padding: 0 24px; text-align: center; }
        .check { font-size: 56px; color: var(--verde); margin-bottom: 12px; }
        .titulo { font-size: 24px; color: var(--texto); font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; margin-bottom: 8px; }
        .sub { color: var(--texto-suave); font-size: 15px; margin-bottom: 28px; }

        .aviso-desc { background: var(--naranja-suave); border: 1px solid var(--naranja); color: var(--naranja-hover); padding: 14px 18px; border-radius: var(--radio); font-size: 14px; margin-bottom: 28px; text-align: left; }
        .aviso-desc strong { display: block; margin-bottom: 4px; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }

        /* Aquí el único .btn es la acción principal */
        .btn { background: var(--naranja); color: var(--barra-bg); padding: 12px 24px; font-size: 15px; }
        .btn:hover { background: var(--naranja-hover); }
    </style>
</head>
<body>
    <div class="barra">
        <h1>Universal <span>Motors</span></h1>
    </div>

    <div class="contenedor">
        <div class="check">✓</div>
        <div class="titulo">Detalle guardado</div>
        <p class="sub">El comprador, los pagos y el precio quedaron registrados para esta venta.</p>

        {% if aviso %}
        <div class="aviso-desc">
            <strong>Aviso: los pagos no cuadran con el precio</strong>
            {{ aviso }}
        </div>
        {% endif %}

        <a href="{{ url_for('admin.vista_ventas_pendientes') }}" class="btn">Volver a pendientes</a>
    </div>
</body>
</html>
