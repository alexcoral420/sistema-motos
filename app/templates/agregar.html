<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Moto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <style>

        .contenedor { max-width: 600px; padding-top: 24px; }
        .card { background: var(--superficie); border: 1px solid var(--borde); border-radius: 12px; padding: 24px; box-shadow: 0 1px 3px rgba(28,31,38,0.06); }
        .preview { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-top: 8px; display: none; }
        .upload-area { border: 2px dashed var(--borde); border-radius: 8px; padding: 24px; text-align: center; cursor: pointer; margin-bottom: 8px; background: var(--superficie-2); color: var(--texto-suave); }
        .upload-area:hover { border-color: var(--naranja); }
        .btn-full { width: 100%; padding: 14px; font-size: 16px; margin-top: 8px; }
        .row { display: flex; gap: 12px; }
        .row .campo { flex: 1; }
    </style>
</head>
<body>
    <div class="barra">
        <h1>➕ Agregar moto</h1>
        <a href="{{ url_for('admin.index') }}" class="btn-back">← Volver</a>
    </div>
    <div class="contenedor">
        <div class="card">
            {% if error %}
                <div class="aviso aviso-error">
                    ⚠️ {{ error }}
                </div>
                {% endif %}
            <form method="POST" enctype="multipart/form-data">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="row">
                    <div class="campo">
                        <label>Marca *</label>
                       <input type="text" name="marca" placeholder="Yamaha, Honda..." value="{{ datos.marca if datos else '' }}" required>
                    </div>
                    <div class="campo">
                        <label>Modelo *</label>
                        <input type="text" name="modelo" placeholder="FZ, CB125..." value="{{ datos.modelo if datos else '' }}" required>
                    </div>
                </div>
                <div class="row">
                    <div class="campo">
                        <label>Año *</label>
                        <input type="number" name="anio" placeholder="2022" min="1990" max="2026" value="{{ datos.anio if datos else '' }}" required>
                    </div>
                    <div class="campo">
                        <label>Cilindraje (cc) *</label>
                        <input type="number" name="cilindraje" placeholder="150" min="90" max="1200" value="{{ datos.cilindraje if datos else '' }}" required>
                    </div>
                    <div class="campo">
                        <label>Color *</label>
                        <input type="text" name="color" placeholder="Rojo, Negro..." value="{{ datos.color if datos else '' }}" required>
                    </div>
                </div>
                    <div class="row">
                    <div class="campo">
                    <label>Placa</label>
                     <input type="text" name="placa" placeholder="ABC123" style="text-transform:uppercase" value="{{ datos.placa if datos else '' }}">
                     </div>
                        </div>
                        <div class="row">
                    <div class="campo">
                        <label>Sede *</label>
                        <select name="sede_id" required>
                            {% for sede in sedes %}
                            <option value="{{ sede.id }}"
                                {% if datos and datos.sede_id == sede.id|string %}selected{% endif %}>
                                {{ sede.nombre }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                
                <div class="row">
                    <div class="campo">
                        <label>Precio (COP) *</label>
                        <input type="number" name="precio" placeholder="8500000" value="{{ datos.precio if datos else '' }}" required>
                    </div>
                    <div class="campo">
                        <label>Kilometraje *</label>
                        <input type="number" name="kilometraje" placeholder="12000" value="{{ datos.kilometraje if datos else '' }}" required>
                    </div>
                </div>
                <div class="row">
                    <div class="campo">
                        <label>Vencimiento SOAT</label>
                        <input type="date" name="soat" value="{{ datos.soat if datos else '' }}">
                    </div>
                    <div class="campo">
                        <label>Vencimiento Tecnomecánica</label>
                        <input type="date" name="tecno" value="{{ datos.tecno if datos else '' }}">
                    </div>
                </div>
                <div class="campo">
                    <label>Descripción</label>
                    <textarea name="descripcion" rows="3" placeholder="Estado general, extras, observaciones...">{{ datos.descripcion if datos else '' }}</textarea>
                </div>
                <div class="campo">
                    <label>Foto</label>
                    <div class="upload-area" onclick="document.getElementById('foto').click()">
                        <p>📷 Toca aquí para subir una foto</p>
                        <p class="nota">JPG, PNG — máx 5MB</p>
                    </div>
                    <input type="file" id="foto" name="foto" accept="image/*" style="display:none" onchange="previewFoto(this)">
                    <img id="preview" class="preview">
                    <input type="hidden" name="foto_url" id="foto_url">
                </div>
                <button type="submit" class="btn btn-primary btn-full">✅ Guardar moto</button>
            </form>
        </div>
    </div>
    <script>
        function previewFoto(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('preview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
