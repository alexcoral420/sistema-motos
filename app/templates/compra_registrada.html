<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra registrada · Universal Motors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <style>
        .contenedor { max-width: 560px; }
        .tarjeta { background: var(--superficie); border: 1px solid var(--borde); border-left: 3px solid var(--verde); border-radius: var(--radio); padding: 24px; margin-top: 24px; }
        .tarjeta h2 { font-size: 20px; color: var(--texto); margin-bottom: 6px; }
        .tarjeta .meta { color: var(--texto-tenue); font-size: 14px; margin-bottom: 20px; }
        .acciones { display: flex; flex-direction: column; gap: 10px; }
        .acciones .btn { text-align: center; padding: 13px 24px; font-size: 16px; }
        .btn-secundario { background: transparent; color: var(--naranja); border: 1px solid var(--naranja); font-weight: 600; }
        .btn-secundario:hover { background: var(--naranja); color: var(--barra-bg); }
    </style>
</head>
<body>
    <div class="barra">
        <h1>Compra <span>registrada</span></h1>
        <a href="{{ url_for('admin.compras_mi_sede') }}" class="btn-back">← Compras</a>
    </div>

    <div class="contenedor">
        <div class="tarjeta">
            <h2>✓ {{ compra.descripcion or 'Moto' }}</h2>
            <div class="meta">
                Placa: {{ compra.placa or '—' }} · Asesor: {{ compra.asesor_nombre or '—' }}
                · Precio: ${{ compra.precio_compra | pesos }}
            </div>
            <div class="acciones">
                <a href="{{ url_for('admin.descargar_contrato_compra', compra_id=compra.id) }}" class="btn btn-primary">📄 Descargar contrato</a>
                <a href="{{ url_for('admin.detalle_moto_admin', id=compra.moto_id) }}" class="btn btn-secundario">Ver la moto</a>
            </div>
        </div>
    </div>
</body>
</html>
