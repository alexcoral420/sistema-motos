<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Moto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <style>

        .contenedor { max-width: 600px; padding-top: 24px; }
        .card { background: var(--superficie); border: 1px solid var(--borde); border-radius: 12px; padding: 24px; box-shadow: 0 1px 3px rgba(28,31,38,0.06); }
        .preview { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-top: 8px; }
        .upload-area { border: 2px dashed var(--borde); border-radius: 8px; padding: 24px; text-align: center; cursor: pointer; margin-bottom: 8px; background: var(--superficie-2); color: var(--texto-suave); }
        .upload-area:hover { border-color: var(--naranja); }
        .btn-full { width: 100%; padding: 14px; font-size: 16px; margin-top: 8px; }
        .row { display: flex; gap: 12px; }
        .row .campo { flex: 1; }
    </style>
</head>
<body>
    <div class="barra">
        <h1>✏️ Editar moto</h1>
        <a href="{{ url_for('admin.index') }}" class="btn-back">← Volver</a>
    </div>
    <div class="contenedor">
        <div class="card">
            {% if error %}
                <div class="aviso aviso-error">
                    ⚠️ {{ error }}
                </div>
                {% endif %}
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="row">
                    <div class="campo">
                        <label>Marca *</label>
                        <input type="text" name="marca" value="{{ moto.marca }}" required>
                    </div>
                    <div class="campo">
                        <label>Modelo *</label>
                        <input type="text" name="modelo" value="{{ moto.modelo }}" required>
                    </div>
                </div>
                <div class="row">
                    <div class="campo">
                        <label>Año *</label>
                        <input type="number" name="anio" value="{{ moto.anio }}" required>
                    </div>
                    <div class="campo">
                        <label>Cilindraje (cc) *</label>
                        <input type="number" name="cilindraje" min="90" max="1200" value="{{ moto.cilindraje }}" required>
                    </div>
                    <div class="campo">
                        <label>Color *</label>
                        <input type="text" name="color" value="{{ moto.color }}" required>
                    </div>
                </div>
                <div class="row">
                <div class="campo">
                <label>Placa</label>
                <input type="text" name="placa" value="{{ moto.placa or '' }}" style="text-transform:uppercase">
                 </div>
                </div>

                <div class="row">
                    <div class="campo">
                        <label>Precio (COP) *</label>
                        <input type="number" name="precio" value="{{ moto.precio }}" required>
                    </div>
                    <div class="campo">
                        <label>Kilometraje *</label>
                        <input type="number" name="kilometraje" value="{{ moto.kilometraje }}" required>
                    </div>
                </div>
                <div class="row">
                    <div class="campo">
                        <label>Vencimiento SOAT</label>
                        <input type="date" name="soat" value="{{ moto.soat or '' }}">
                    </div>
                    <div class="campo">
                        <label>Vencimiento Tecnomecánica</label>
                        <input type="date" name="tecno" value="{{ moto.tecno or '' }}">
                    </div>
                </div>
                <div class="campo">
                    <label>Sede *</label>
                    <select name="sede_id" required>
                        {% for sede in sedes %}
                        <option value="{{ sede.id }}"
                            {% if moto.sede_id|string == sede.id|string %}selected{% endif %}>
                            {{ sede.nombre }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="campo">
                    <label>Estado</label>
                    <select name="estado">
                        <option value="disponible" {% if moto.estado == 'disponible' %}selected{% endif %}>Disponible</option>
                        <option value="reservado" {% if moto.estado == 'reservado' %}selected{% endif %}>Reservado</option>
                        <option value="vendido" {% if moto.estado == 'vendido' %}selected{% endif %}>Vendido</option>
                    </select>
                </div>
                <div class="campo">
                    <label>Descripción</label>
                    <textarea name="descripcion" rows="3">{{ moto.descripcion or '' }}</textarea>
                </div>
                <div class="campo">
                    <label>Foto actual</label>
                    {% if moto.foto_url %}
                        <img src="{{ moto.foto_url }}" class="preview">
                    {% else %}
                        <p class="tenue">Sin foto</p>
                    {% endif %}
                    <div class="upload-area" style="margin-top:8px" onclick="document.getElementById('foto').click()">
                        <p>📷 Cambiar foto</p>
                    </div>
                    <input type="file" id="foto" name="foto" accept="image/*" style="display:none" onchange="previewFoto(this)">
                    <input type="hidden" name="foto_url" value="{{ moto.foto_url }}">
                </div>
                <button type="submit" class="btn btn-primary btn-full">💾 Guardar cambios</button>
            </form>
        </div>
    </div>
    <script>
        function previewFoto(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.querySelector('.preview')
                        ? document.querySelector('.preview').src = e.target.result
                        : null;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
